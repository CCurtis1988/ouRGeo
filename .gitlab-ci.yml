# .gitlab-ci.yml
# Builds ouRGeo installers for Linux (.deb + AppImage) and Windows (.exe),
# then publishes a GitLab Release with download links.
#
# Triggers ONLY on version tags: v1.8.0, v1.9.0, ...  The numeric part of the
# tag MUST match "version" in package.json (electron-builder names artifacts
# from package.json, and the release links are built from the tag). So to cut
# a release: bump package.json version, commit, then `git tag v1.8.0 && git push --tags`.
#
# RUNNERS this pipeline expects (register these on your VMs — see DEPLOYMENT.md):
#   - a runner tagged `linux-builder`   (Docker executor recommended; shell also works)
#   - a runner tagged `windows-builder` (SHELL executor on the Windows VM — Node + git installed)
#
# If your Linux runner is a *shell* executor (not Docker), delete the `image:`
# line from build:linux and make sure the host has Node 22+, dpkg and fakeroot.
#
# PUBLISHING is GitLab's, through release-cli in the last stage — never
# electron-builder's. That has to be said out loud because electron-builder
# turns publishing on BY ITSELF when it is building from a git tag, works out
# the provider from `repository` in package.json (github.com/...), and then
# fails the whole build with "GitHub Personal Access Token is not set". Since
# every pipeline here is a tag pipeline, that fired on every one. The package
# scripts pass `--publish never`, which is also what the deprecation notice
# asks for — implicit publishing goes away in electron-builder v27.

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'

stages:
  - build
  - release

variables:
  # electron-builder: never try to discover / use code-signing certs in CI.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  # Avoid hard-link errors on some CI filesystems.
  USE_HARD_LINKS: "false"
  # Keep Electron / electron-builder download caches inside the project so the
  # GitLab job cache can persist them between pipelines.
  ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
  ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"

# ── Linux build: .deb + AppImage ─────────────────────────────────────────
build:linux:
  stage: build
  tags:
    - linux-builder
  # electron-builder fetches its own toolchain from GitHub releases at build
  # time — electron itself, appimagetool, fpm, nsis — and a 500 from that CDN
  # fails the job through no fault of the code. A tag build happens a handful
  # of times a year, so one automatic retry is cheap; the cost is that a
  # genuine breakage takes two cycles to report. Drop this if that annoys.
  retry: 1
  # Used only by a Docker executor; ignored by a shell executor.
  image: node:22-bookworm
  before_script:
    # Build dep for the .deb target (electron-builder shells out to fakeroot).
    # dpkg/dpkg-deb already ship in the node base image; only fakeroot is missing.
    # Guard on fakeroot itself so shell runners with it preinstalled skip apt
    # entirely, while Docker runners always `apt-get update` first (Debian base
    # images ship with empty apt lists, so install without update finds no
    # candidate).
    - if ! command -v fakeroot >/dev/null 2>&1; then apt-get update && apt-get install -y --no-install-recommends fakeroot; fi
    - node --version
    - npm --version
  script:
    - npm ci
    - npm run package:linux
  artifacts:
    name: "ouRGeo-${CI_COMMIT_TAG}-linux"
    expire_in: never
    paths:
      - dist/*.AppImage
      - dist/*.deb
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .cache/

# ── Windows build: NSIS .exe ─────────────────────────────────────────────
# Expects a SHELL executor on a Windows VM with Node 22+ and git on PATH.
# (Windows Docker containers are impractical for electron-builder.)
build:windows:
  stage: build
  tags:
    - windows-builder
  # See build:linux — this is the job that actually hit it, on nsis-3.0.4.1.7z.
  retry: 1
  before_script:
    - node --version
    - npm --version
  script:
    - npm ci
    - npm run package:win
  artifacts:
    name: "ouRGeo-${CI_COMMIT_TAG}-windows"
    expire_in: never
    paths:
      - dist/*.exe
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .cache/

# ── Release: GitLab Release with links to the three installers ───────────
create_release:
  stage: release
  tags:
    - linux-builder
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - build:linux
    - build:windows
  script:
    # electron-builder names artifacts from package.json version (no leading "v"),
    # so strip it from the tag to build the artifact download URLs.
    - VERSION="${CI_COMMIT_TAG#v}"
    - BASE="${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist"
    - |
      release-cli create \
        --name "ouRGeo ${CI_COMMIT_TAG}" \
        --tag-name "${CI_COMMIT_TAG}" \
        --description "Automated release ${CI_COMMIT_TAG}. Installers are attached below. Note: ouRGeo requires R to be installed on the system — see the README." \
        --assets-link "{\"name\":\"Linux AppImage\",\"link_type\":\"package\",\"url\":\"${BASE}/ouRGeo-${VERSION}.AppImage?job=build:linux\"}" \
        --assets-link "{\"name\":\"Linux .deb\",\"link_type\":\"package\",\"url\":\"${BASE}/ouRGeo-${VERSION}.deb?job=build:linux\"}" \
        --assets-link "{\"name\":\"Windows Installer (.exe)\",\"link_type\":\"package\",\"url\":\"${BASE}/ouRGeo-${VERSION}.exe?job=build:windows\"}"
